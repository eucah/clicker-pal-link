name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Init Capacitor
        run: npx cap init "Essais Continuité" com.eucah.clickerpal

      - name: Create Android project
        run: npx cap add android

      - name: Add permissions to AndroidManifest
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.BLUETOOTH" />\
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\
    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
</manifest>|' android/app/src/main/AndroidManifest.xml

      - name: Update app label and icon
        run: |
          sed -i 's|android:label="@string/app_name"|android:label="Essais Continuité"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Essais Continuité</string>|' android/app/src/main/res/values/strings.xml
          # Copy app icon to all Android drawable densities
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/app-icon.png "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
            cp public/app-icon.png "android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
            cp public/app-icon.png "android/app/src/main/res/mipmap-${dir}/ic_launcher_foreground.png" 2>/dev/null || true
          done

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: essais-continuite-apk
          path: android/app/build/outputs/apk/debug/EssaisContinuité.apk