name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete old successful Android build runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: Build Android APK
          delete_run_by_conclusion_pattern: success
          keep_minimum_runs: 5
          retain_days: 7
          dry_run: false